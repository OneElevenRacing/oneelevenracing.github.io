  <script>
    // Your Firebase config
    var firebaseConfig = {
        apiKey: "AIzaSyDpH1j5UfMlGXLqHaK7lqVWi0CkGbfN9SI",
        authDomain: "one-eleven-app-7f282.firebaseapp.com",
        databaseURL: "https://one-eleven-app-7f282-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "one-eleven-app-7f282",
        storageBucket: "one-eleven-app-7f282.appspot.com",
        messagingSenderId: "503866403242",
        appId: "1:503866403242:ios:782e6c3e12ec99e66aa3d3"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    let pollPageStarted = false;

    function startPollPageWhenReady() {
      if (pollPageStarted) return;

      if (typeof startPollPage === 'function') {
        pollPageStarted = true;
        startPollPage();
      } else {
        window.pendingPollPageStart = true;
      }
    }

    function addPollAdminButton() {
      if (document.getElementById('pollAdminButton')) return;

      const adminButton = document.createElement('button');
      adminButton.id = "pollAdminButton";
      adminButton.textContent = "Go to Poll Admin Page";
      adminButton.addEventListener('click', () => {
        window.location.href = "poll_admin.html";
      });
      document.body.appendChild(adminButton);
    }

    // Check user sign in and active driver status before starting Firestore reads.
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        console.log("User signed in:", user.uid);

        firebase.database().ref(`drivers/${user.uid}`).once("value")
          .then(snapshot => {
            const driver = snapshot.val();
            if (!driver || driver.active !== true) {
              console.log("User is NOT authorized.");
              alert("Access denied: You are not authorized.");
              window.location.href = "main.html";
              return;
            }

            console.log("User is authorized for Firestore:", user.uid);
            startPollPageWhenReady();

            if (driver.isAdmin === true) addPollAdminButton();
          })
          .catch(error => {
            console.error("Error checking authorization:", error);
            alert("Unable to verify access. Please try again.");
            window.location.href = "main.html";
          });
      } else {
        console.log("No user signed in");
        window.location.href = "index.html";
      }
    });
  </script>

<!-- Javascript Initialisation -->
<script src="script.js" defer></script>

<body>
  <header>
      <a href="javascript:void(0);" class="back-button" id="back" onclick="window.location.href='main.html'">
          <img src="Logos_and_icons/back.png" alt="Back">
      </a>
      <a href="javascript:void(0);" class="headerbuttonnotselected" id="settings" onclick="window.location.href='settings.html'">
          <img src="Logos_and_icons/settings.png" alt="Settings">
      </a>
  </header>

    <div class="poll-heading">
      <button type="button" id="nextPollButton" class="poll-nav-button" aria-label="View next week's poll" hidden>
        <span class="poll-nav-arrow" aria-hidden="true"></span>
      </button>

      <h2 id="pollTitleHeader">Latest Poll</h2>

      <button type="button" id="previousPollButton" class="poll-nav-button" aria-label="View previous week's poll" hidden>
        <span class="poll-nav-arrow" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Poll table for results -->
    <div class="table-container">
     <table id="responsesTable" border="1" style="display: table; margin-left: auto; margin-right: auto;">
        <thead>
          <tr id="pollOptionsHeader"> 
            <th>Name</th> <!-- Name stays fixed -->
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr id="totalsRow">
            <th>Total</th> <!-- First column for totals label -->
          </tr>
        </tfoot>
      </table>
    </div>

    <h2 class="availability-heading">Your Availability</h2>

    <div id="latestPollContainer"></div>

<!-- Main script: fetch poll data and display it -->
<script>
  let availablePolls = [];
  let selectedPollIndex = 0;
  let unsubscribeResponses = null;
  let pollRenderVersion = 0;
  let responseRenderVersion = 0;

  const nextPollButton = document.getElementById("nextPollButton");
  const previousPollButton = document.getElementById("previousPollButton");

  nextPollButton.addEventListener("click", () => {
    if (selectedPollIndex > 0) {
      selectedPollIndex--;
      renderSelectedPoll();
    }
  });

  previousPollButton.addEventListener("click", () => {
    if (selectedPollIndex < availablePolls.length - 1) {
      selectedPollIndex++;
      renderSelectedPoll();
    }
  });

  function startPollPage() {
    console.log("Fetching polls...");
    db.collection("polls")
    .onSnapshot((snapshot) => {
      console.log("Snapshot received");
      const selectedPollId = availablePolls[selectedPollIndex]?.id;

      if (snapshot.empty) {
        console.log("No polls found.");
        availablePolls = [];
        selectedPollIndex = 0;
        clearPollDisplay("No polls found.");
        return;
      }

      availablePolls = snapshot.docs.map(doc => ({
        id: doc.id,
        data: doc.data()
      })).sort(comparePollsNewestFirst);

      const retainedIndex = availablePolls.findIndex(poll => poll.id === selectedPollId);
      selectedPollIndex = retainedIndex >= 0 ? retainedIndex : 0;
      renderSelectedPoll();
    }, error => {
      console.error("Error fetching polls:", error);
      clearPollDisplay("Unable to load polls. Please try again.");
    });
  }

  function comparePollsNewestFirst(a, b) {
    const weekDifference = getPollWeekStartTime(b.data) - getPollWeekStartTime(a.data);
    if (weekDifference !== 0) return weekDifference;
    return getCreatedAtTime(b.data) - getCreatedAtTime(a.data);
  }

  function getCreatedAtTime(poll) {
    if (poll.createdAt?.toDate) return poll.createdAt.toDate().getTime();
    const createdAt = new Date(poll.createdAt || 0).getTime();
    return Number.isNaN(createdAt) ? 0 : createdAt;
  }

  function getPollWeekStartTime(poll) {
    if (typeof poll.weekStart === "string" && /^\d{4}-\d{2}-\d{2}$/.test(poll.weekStart)) {
      return Date.parse(`${poll.weekStart}T00:00:00Z`);
    }

    if (poll.weekStart?.toDate) {
      return poll.weekStart.toDate().getTime();
    }

    const firstOptionDate = (poll.options?.[0] || "").match(/(\d{1,2})[./](\d{1,2})/);
    if (firstOptionDate) {
      const titleYear = (poll.title || "").match(/^\s*(\d{4})\b/);
      const createdDate = new Date(getCreatedAtTime(poll));
      let year = titleYear ? Number(titleYear[1]) : createdDate.getUTCFullYear();

      if (!titleYear && !Number.isNaN(createdDate.getTime())) {
        const optionMonth = Number(firstOptionDate[2]);
        const createdMonth = createdDate.getUTCMonth() + 1;
        if (createdMonth === 12 && optionMonth === 1) year++;
        if (createdMonth === 1 && optionMonth === 12) year--;
      }

      return Date.UTC(year, Number(firstOptionDate[2]) - 1, Number(firstOptionDate[1]));
    }

    return getCreatedAtTime(poll);
  }

  function formatDateKeyFromTime(time) {
    const date = new Date(time);
    return [
      date.getUTCFullYear(),
      String(date.getUTCMonth() + 1).padStart(2, "0"),
      String(date.getUTCDate()).padStart(2, "0")
    ].join("-");
  }

  function getOptionDateKey(poll, option, optionIndex) {
    const expectedTime = getPollWeekStartTime(poll) + (optionIndex * 86400000);
    const optionDate = option.match(/(\d{1,2})[./](\d{1,2})/);
    if (!optionDate) return formatDateKeyFromTime(expectedTime);

    const expectedYear = new Date(expectedTime).getUTCFullYear();
    const day = Number(optionDate[1]);
    const month = Number(optionDate[2]) - 1;
    const possibleTimes = [expectedYear - 1, expectedYear, expectedYear + 1]
      .map(year => Date.UTC(year, month, day));
    const closestTime = possibleTimes.reduce((closest, candidate) =>
      Math.abs(candidate - expectedTime) < Math.abs(closest - expectedTime) ? candidate : closest
    );

    return formatDateKeyFromTime(closestTime);
  }

  function getUkTodayKey() {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/London",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    const value = type => parts.find(part => part.type === type)?.value;
    return `${value("year")}-${value("month")}-${value("day")}`;
  }

  function updatePollNavigation() {
    nextPollButton.hidden = selectedPollIndex === 0 || availablePolls.length === 0;
    previousPollButton.hidden = selectedPollIndex >= availablePolls.length - 1;
  }

  function clearPollDisplay(message) {
    pollRenderVersion++;
    responseRenderVersion++;
    if (unsubscribeResponses) {
      unsubscribeResponses();
      unsubscribeResponses = null;
    }

    document.getElementById("pollTitleHeader").textContent = "Race Availability";
    document.getElementById("latestPollContainer").textContent = message;
    document.getElementById("pollOptionsHeader").innerHTML = "<th>Name</th>";
    document.querySelector("#responsesTable tbody").innerHTML = "";
    document.getElementById("totalsRow").innerHTML = "<th>Total</th>";
    updatePollNavigation();
  }

  async function renderSelectedPoll() {
    const pollRecord = availablePolls[selectedPollIndex];
    if (!pollRecord) {
      clearPollDisplay("No polls found.");
      return;
    }

    const renderVersion = ++pollRenderVersion;
    const poll = pollRecord.data;
    const pollId = pollRecord.id;
    const pollOptions = poll.options || [];
    const latestContainer = document.getElementById("latestPollContainer");
    const user = firebase.auth().currentUser;

    if (!user) return;

    document.getElementById("pollTitleHeader").textContent = poll.title || "Untitled Poll";
    latestContainer.innerHTML = '<p class="poll-loading">Loading your availability...</p>';
    updatePollNavigation();
    prepareResponsesTable(pollOptions);
    subscribeToResponses(pollId, pollOptions, renderVersion);

    try {
      const responseDocument = await db.collection("polls").doc(pollId)
        .collection("responses").doc(user.uid).get();
      if (renderVersion !== pollRenderVersion) return;

      const previousResponses = responseDocument.exists
        ? (responseDocument.data().dayResponses || {})
        : {};
      buildAvailabilityTable(pollRecord, previousResponses, user, renderVersion);
    } catch (error) {
      if (renderVersion !== pollRenderVersion) return;
      console.error("Error fetching previous responses:", error);
      latestContainer.textContent = "Unable to load your availability. Please try again.";
    }
  }

  function buildAvailabilityTable(pollRecord, previousResponses, user, renderVersion) {
    const poll = pollRecord.data;
    const pollOptions = poll.options || [];
    const pollId = pollRecord.id;
    const todayKey = getUkTodayKey();
    const pastOptions = pollOptions.map((option, index) =>
      getOptionDateKey(poll, option, index) < todayKey
    );
    const hasEditableDates = pastOptions.some(isPast => !isPast);
    const latestContainer = document.getElementById("latestPollContainer");
    latestContainer.innerHTML = "";

    const selectionTable = document.createElement("table");
    selectionTable.classList.add("poll-table");
    selectionTable.border = "1";

    const headerRow = document.createElement("tr");
    headerRow.appendChild(document.createElement("th"));
    pollOptions.forEach((day, index) => {
      const th = document.createElement("th");
      th.textContent = day.replace(/\./g, "/");
      if (pastOptions[index]) {
        th.classList.add("past-date");
        th.title = "This date has passed and is read-only";
      }
      headerRow.appendChild(th);
    });
    selectionTable.appendChild(headerRow);

    const statuses = [
      { value: "yes", symbol: "✓", color: "lightgreen", textColor: "#2d6b2d" },
      { value: "maybe", symbol: "o", color: "khaki", textColor: "#625a2e" },
      { value: "no", symbol: "x", color: "lightcoral", textColor: "#752f2f" }
    ];

    statuses.forEach(({ value, symbol, color, textColor }) => {
      const row = document.createElement("tr");
      const rowLabelCell = document.createElement("td");
      rowLabelCell.textContent = symbol;
      rowLabelCell.style.backgroundColor = color;
      rowLabelCell.style.color = textColor;
      rowLabelCell.style.fontWeight = "bold";
      rowLabelCell.style.textAlign = "center";
      rowLabelCell.style.width = "60px";
      row.appendChild(rowLabelCell);

      pollOptions.forEach((day, index) => {
        const cell = document.createElement("td");
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = `option_${index}`;
        radio.value = value;
        radio.dataset.optionIndex = index;
        radio.checked = previousResponses[day] === value;
        radio.disabled = pastOptions[index];
        radio.setAttribute("aria-label", `${value} for ${day}`);

        if (pastOptions[index]) cell.classList.add("past-date");
        cell.appendChild(radio);
        row.appendChild(cell);
      });
      selectionTable.appendChild(row);
    });

    latestContainer.appendChild(selectionTable);

    const submitBtn = document.createElement("button");
    submitBtn.textContent = hasEditableDates ? "Submit Availability" : "Poll Closed";
    submitBtn.disabled = !hasEditableDates;
    latestContainer.appendChild(submitBtn);

    const statusP = document.createElement("p");
    statusP.className = "availability-status";
    latestContainer.appendChild(statusP);

    submitBtn.addEventListener("click", async () => {
      if (renderVersion !== pollRenderVersion) return;
      const currentUser = firebase.auth().currentUser;
      if (!currentUser || currentUser.uid !== user.uid) {
        statusP.textContent = "You must be signed in to submit availability.";
        return;
      }

      // Recheck the UK date in case the page has remained open across midnight.
      const currentTodayKey = getUkTodayKey();
      const newlyClosedDate = pollOptions.some((option, index) =>
        !pastOptions[index] && getOptionDateKey(poll, option, index) < currentTodayKey
      );
      if (newlyClosedDate) {
        renderSelectedPoll();
        return;
      }

      // Begin with the saved answers so past dates remain completely unchanged.
      const dayResponses = { ...previousResponses };
      pollOptions.forEach((option, index) => {
        if (pastOptions[index]) return;
        const selectedRadio = selectionTable.querySelector(`input[data-option-index="${index}"]:checked`);
        dayResponses[option] = selectedRadio ? selectedRadio.value : "no";
      });

      submitBtn.disabled = true;
      statusP.textContent = "Saving...";
      try {
        await db.collection("polls").doc(pollId)
          .collection("responses").doc(currentUser.uid)
          .set({
            submittedAt: new Date(),
            dayResponses: dayResponses
          });
        if (renderVersion === pollRenderVersion) {
          Object.assign(previousResponses, dayResponses);
          statusP.textContent = "Availability updated!";
        }
      } catch (error) {
        console.error("Error saving availability:", error);
        if (renderVersion === pollRenderVersion) statusP.textContent = "Failed to save.";
      } finally {
        if (renderVersion === pollRenderVersion) submitBtn.disabled = false;
      }
    });
  }

  if (window.pendingPollPageStart) {
    window.pendingPollPageStart = false;
    startPollPageWhenReady();
  }

  function prepareResponsesTable(pollOptions) {
    const headerRow = document.getElementById("pollOptionsHeader");
    headerRow.innerHTML = "<th>Name</th>";
    pollOptions.forEach(option => {
      const th = document.createElement("th");
      th.textContent = option.replace(/\./g, "/");
      headerRow.appendChild(th);
    });
    document.querySelector("#responsesTable tbody").innerHTML = "";

    const emptyTotals = {};
    pollOptions.forEach(option => {
      emptyTotals[option] = { yes: 0, no: 0, maybe: 0 };
    });
    updateTotalsRow(emptyTotals, pollOptions);
  }

  function subscribeToResponses(pollId, pollOptions, renderVersion) {
    responseRenderVersion++;
    if (unsubscribeResponses) unsubscribeResponses();

    unsubscribeResponses = db.collection("polls").doc(pollId).collection("responses")
      .onSnapshot(async responseSnapshot => {
        const currentResponseVersion = ++responseRenderVersion;
        const responses = await Promise.all(responseSnapshot.docs.map(async responseDoc => {
          const responseData = responseDoc.data();
          const nameSnapshot = await firebase.database().ref(`drivers/${responseDoc.id}/name`).once("value");
          return {
            userName: nameSnapshot.exists() ? nameSnapshot.val() : responseDoc.id,
            dayResponses: responseData.dayResponses || {}
          };
        }));

        if (renderVersion !== pollRenderVersion || currentResponseVersion !== responseRenderVersion) return;

        const responsesTable = document.querySelector("#responsesTable tbody");
        responsesTable.innerHTML = "";
        const totals = {};
        pollOptions.forEach(option => {
          totals[option] = { yes: 0, no: 0, maybe: 0 };
        });

        responses.sort((a, b) => a.userName.localeCompare(b.userName)).forEach(response => {
          const row = responsesTable.insertRow();
          row.insertCell(0).textContent = response.userName;

          pollOptions.forEach(option => {
            const choice = response.dayResponses[option] || "no";
            const cell = row.insertCell(-1);
            const display = {
              yes: { symbol: "✓", color: "lightgreen", textColor: "#2d6b2d" },
              maybe: { symbol: "o", color: "khaki", textColor: "#625a2e" },
              no: { symbol: "x", color: "lightcoral", textColor: "#752f2f" }
            }[choice] || { symbol: "x", color: "lightcoral", textColor: "#752f2f" };

            cell.textContent = display.symbol;
            cell.style.backgroundColor = display.color;
            cell.style.color = display.textColor;
            cell.style.fontWeight = "bold";

            if (choice === "yes") totals[option].yes++;
            else if (choice === "maybe") totals[option].maybe++;
            else totals[option].no++;
          });
        });

        updateTotalsRow(totals, pollOptions);
      }, error => {
        console.error("Error fetching poll responses:", error);
      });
  }

  function updateTotalsRow(totals, pollOptions) {
    const totalsRow = document.getElementById("totalsRow");
    totalsRow.innerHTML = "<th>Total</th>";

    pollOptions.forEach(option => {
      const totalCell = document.createElement("th");
      const dayTotals = totals[option];
      totalCell.textContent = `${dayTotals.yes} (+${dayTotals.maybe})`;
      totalsRow.appendChild(totalCell);
    });
  }
</script>
