<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="Logos_and_icons/Icons/111_icon180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="Logos_and_icons/Icons/111_icon152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="Logos_and_icons/Icons/111_icon120.png">
  <link rel="icon" href="Logos_and_icons/Icons/111_icon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8" />
  <title>One Eleven Racing - Championship Admin</title>

  <!-- Firebase scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-firestore.js"></script>
  <script src="tracks.js"></script>

  <style>
    :root{
      --bg:#fff;
      --text:#111;
      --muted:#6b7280;
      --border:#e5e7eb;
      --border-dark:#d1d5db;
      --accent:#000;        /* matches site header */
      --accent-weak:#222;
      --accent-text:#fff;
      --ok:#16a34a;
      --err:#dc2626;
      --chip:#f3f4f6;
    }
    /* Page */
    html,body{height:100%}
    body{
      display:none; /* stays until auth passes */
      font-family:'KeepCalm', Arial, sans-serif; /* match site vibe if font available */
      background:var(--bg);
      color:var(--text);
      margin:0;
    }
  
    /* Layout */
    .container{
      max-width:1000px;
      margin:32px auto 96px;
      padding:0 16px;
    }
    header{
      position:sticky; top:0; z-index:10;
      background:#000; color:#fff;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
      padding:14px 16px;
    }
    header h1{
      margin:0; font-size:20px; letter-spacing:.5px;
    }
    .actions-bar{
      display:flex; gap:8px; margin:16px 0 4px;
    }
    .grid{
      display:grid; gap:16px;
    }
    @media (min-width:900px){
      .grid.two{ grid-template-columns:1fr 1fr; }
    }
  
    /* Card */
    .card{
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
      box-shadow:0 2px 10px rgba(0,0,0,.04);
      overflow:hidden;
    }
    .card-head{
      padding:12px 16px;
      background:#f9fafb;
      border-bottom:1px solid var(--border);
      font-weight:700;
    }
    .card-body{ padding:16px; }
  
    /* Form */
    .form-row{
      display:grid; grid-template-columns:160px 1fr; gap:10px;
      align-items:center; margin-bottom:10px;
    }
    .form-row.inline { grid-template-columns:1fr 1fr; }
    label{ font-size:13px; color:var(--muted); }
    input[type="text"], input[type="number"], select{
      width:100%; box-sizing:border-box;
      padding:8px 10px; font-size:14px;
      border:1px solid var(--border-dark); border-radius:10px;
      background:#fff;
    }
    small.hint{ color:var(--muted); margin-left:6px; }
  
    /* Track list */
    #trackSelectors{ display:grid; gap:10px; }
    .race-item{
      display:grid; gap:8px;
      grid-template-columns: minmax(80px,110px) 1fr auto;
      align-items:center;
      padding:10px; border:1px dashed var(--border);
      border-radius:10px; background:#fff;
    }
    .race-title{ font-weight:700; color:#111; }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px; background:var(--chip);
      border:1px solid var(--border);
      font-size:12px; color:#111;
    }
  
    /* Buttons */
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:8px; padding:10px 14px; border-radius:999px;
      border:1px solid var(--border-dark);
      background:#fff; color:#111; cursor:pointer; font-weight:600;
    }
    .btn:hover{ background:#f9fafb; }
    .btn-primary{
      background:var(--accent); color:var(--accent-text);
      border-color:var(--accent-weak);
    }
    .btn-primary:hover{ background:#111; }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
  
    /* Status text */
    .status{ margin-top:8px; font-size:13px; }
    .status.ok{ color:var(--ok); }
    .status.err{ color:var(--err); }
  
    /* Utility */
    .spacer{ height:10px; }
    .muted{ color:var(--muted); }
  </style>
  

  <script>
    // === Firebase Setup ===
    var firebaseConfig = {
      apiKey: "AIzaSyDpH1j5UfMlGXLqHaK7lqVWi0CkGbfN9SI",
      authDomain: "one-eleven-app-7f282.firebaseapp.com",
      databaseURL: "https://one-eleven-app-7f282-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "one-eleven-app-7f282",
      storageBucket: "one-eleven-app-7f282.appspot.com",
      messagingSenderId: "503866403242",
      appId: "1:503866403242:ios:782e6c3e12ec99e66aa3d3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();


    // Generate track selections
    function generateTrackSelectors(numRaces) {
      const trackSelectorsDiv = document.getElementById('trackSelectors');
      trackSelectorsDiv.innerHTML = ''; // Clear previous

      for (let i = 1; i <= numRaces; i++) {
        const item = document.createElement('div');
        item.className = 'race-item';

        const title = document.createElement('div');
        title.className = 'race-title';
        title.textContent = `Race ${i}`;

        const select = document.createElement('select');
        select.name = `race${i}`;
        select.id = `race${i}`;
        select.required = true;

        if (!trackData || trackData.length === 0) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = '(No tracks found)';
          select.appendChild(opt);
        } else {
          trackData.forEach(track => {
            const option = document.createElement('option');
            option.value = track.name;
            option.textContent = track.name;
            select.appendChild(option);
          });
        }

        const chip = document.createElement('label');
        chip.className = 'chip';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `special${i}`;
        checkbox.name = `special${i}`;
        chip.appendChild(checkbox);
        chip.appendChild(document.createTextNode(' Special Event'));

        item.appendChild(title);
        item.appendChild(select);
        item.appendChild(chip);

        trackSelectorsDiv.appendChild(item);
      }
    }



    function loadAdminPage() {
      document.body.style.display = "block";

      const trackSelectorsDiv = document.getElementById('trackSelectors');
      const dropdown = document.getElementById('seasonSelectDropdown');
      const message = document.getElementById('activeSeasonMessage');

      firebase.firestore().collection('championships').get()
        .then(snapshot => {
          dropdown.innerHTML = '<option value="">-- Select a season --</option>';
          snapshot.forEach(doc => {
            const data = doc.data();
            const option = document.createElement('option');
            option.value = doc.id;
            option.textContent = `${data.seasonName} (${doc.id})` + (data.isActive ? ' ✅' : '');
            dropdown.appendChild(option);
          });
          message.textContent = "✅ Seasons loaded successfully.";
          message.className = "status ok";

        })
        .catch(error => {
          console.error("Error loading seasons:", error);
          message.textContent = "❌ Could not load seasons.";
          message.className = "status err";
        });

      document.getElementById('setActiveBtn').addEventListener('click', async () => {
        const selectedSeasonId = dropdown.value;
        const statusMsg = document.getElementById('setActiveStatusMessage');

        if (!selectedSeasonId) {
          statusMsg.textContent = "⚠️ Please select a season first.";
          return;
        }

        try {
          const championshipsRef = firebase.firestore().collection('championships');
          const snapshot = await championshipsRef.get();
          const batch = firebase.firestore().batch();

          snapshot.forEach(doc => {
            const isSelected = doc.id === selectedSeasonId;
            batch.update(championshipsRef.doc(doc.id), { isActive: isSelected });
          });

          await batch.commit();
          statusMsg.textContent = `✅ Season "${selectedSeasonId}" is now active.`;
          location.reload();
        } catch (error) {
          console.error("Error setting active season:", error);
          statusMsg.textContent = "❌ Failed to set active season.";
        }
      });

      const seasonForm = document.getElementById('seasonForm');
      seasonForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const year = document.getElementById('year').value;
        const quarter = document.getElementById('quarter').value;
        const carClass = document.getElementById('carClass').value;
        const seasonId = `${year}${quarter}`;

        const numRaces = parseInt(document.getElementById('numRaces').value);
        const races = {};
        for (let i = 1; i <= numRaces; i++) {
          const trackName = document.getElementById(`race${i}`).value;
          const special = document.getElementById(`special${i}`).checked;
          races[`race${i}`] = { trackName, special };
        }
        const dropRacesRaw = parseInt(document.getElementById('numDrops').value);
        const dropRaces = Math.max(0, Math.min(dropRacesRaw, numRaces)); // clamp for safety

        const seasonRef = firebase.firestore().collection('championships').doc(seasonId);
        seasonRef.get().then(docSnapshot => {
          if (docSnapshot.exists) {
            document.getElementById('seasonStatusMessage').textContent =
              `⚠️ A season with ID "${seasonId}" already exists. Please choose a different year/quarter.`;
          } else {
            // Safe to create new season
            seasonRef.set({
              seasonName: `${year} ${quarter}`,
              seasonCode: seasonId,
              carClass,
              isActive: false,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              dropRaces,
              races
            })
            .then(() => {
              document.getElementById('seasonStatusMessage').textContent =
                `✅ Season "${seasonId}" created successfully (dropRaces = ${dropRaces}).`;
            })
            .catch((error) => {
              console.error("❌ Error creating season:", error);
              document.getElementById('seasonStatusMessage').textContent =
                `❌ Error creating season: ${error.message}`;
            });
          }
        });
      });
    }

    // === Auth + Admin Check ===
    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        console.warn("🚫 Not signed in – redirecting.");
        window.location.href = "championship.html";
        return;
      }

      firebase.database().ref(`drivers/${user.uid}`).once("value")
        .then(snapshot => {
          const driver = snapshot.val();
          if (driver && driver.active === true && driver.isAdmin === true) {
            console.log("👑 User is admin:", user.uid);
            loadAdminPage();
          } else {
            console.warn("⚠️ User is signed in but not an admin. Redirecting.");
            window.location.href = "championship.html";
          }
        })
        .catch(error => {
          console.error("❌ Error checking admin status:", error);
          document.body.innerHTML = "<h2>Error verifying access. Please try again later.</h2>";
          document.body.style.display = "block";
          console.log("Admin page loaded — setting up race selector interface...");

        });

        const numRacesInput = document.getElementById('numRaces');
        const numDropsInput = document.getElementById('numDrops');
        const numDropsHint = document.getElementById('numDropsHint');

        function syncMaxDrops() {
          const num = parseInt(numRacesInput.value) || 0;
          // Set max allowed drop races = number of races
          numDropsInput.max = num;

          // If current drop value exceeds new max, clamp it down
          const current = parseInt(numDropsInput.value) || 0;
          if (current > num) {
            numDropsInput.value = num;
          }

          // Update the hint so users see the current cap
          if (numDropsHint) {
            numDropsHint.textContent = `(max ${num})`;
          }
        }
        syncMaxDrops();

        generateTrackSelectors(parseInt(numRacesInput.value));

        numRacesInput.addEventListener('change', () => {
          const num = parseInt(numRacesInput.value);
          if (num >= 1 && num <= 24) {
            generateTrackSelectors(num);
            syncMaxDrops(); // keep drop races capped to the new number of races
          }
        });
    });
  </script>
</head>
<body>
  <header>
    <h1>Championship Admin</h1>
  </header>
  <div class="container">

    <div class="actions-bar">
      <button class="btn" onclick="window.location.href='championship.html';">← Back to Championship</button>
    </div>
  
    <!-- Create Season -->
    <section id="season-creation" class="card">
      <div class="card-head">Create a Season</div>
      <div class="card-body">
        <form id="seasonForm" novalidate>
          <div class="form-row">
            <label for="year">Year</label>
            <select id="year" required>
              <option value="">Select year</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026">2026</option>
            </select>
          </div>
  
          <div class="form-row">
            <label for="quarter">Quarter</label>
            <select id="quarter" required>
              <option value="">Select quarter</option>
              <option value="Q1">Q1</option>
              <option value="Q2">Q2</option>
              <option value="Q3">Q3</option>
              <option value="Q4">Q4</option>
            </select>
          </div>
  
          <div class="form-row">
            <label for="carClass">Car Class</label>
            <input type="text" id="carClass" placeholder="e.g. GTE" required />
          </div>
  
          <div class="spacer"></div>
  
          <div class="grid two">
            <div class="form-row">
              <label for="numRaces">Number of Races</label>
              <input type="number" id="numRaces" min="1" max="24" value="10" required />
            </div>
            <div class="form-row">
              <label for="numDrops">Dropped Races <small class="hint" id="numDropsHint">(max will match the number of races)</small></label>
              <input type="number" id="numDrops" min="0" value="2" required />
            </div>
          </div>
  
          <div class="spacer"></div>
  
          <h3 style="margin:0 0 8px 0;">Race Locations</h3>
          <div id="trackSelectors"></div>
  
          <div class="spacer"></div>
  
          <button type="submit" class="btn btn-primary" id="createSeasonBtn">Create Season</button>
          <div id="seasonStatusMessage" class="status"></div>
        </form>
      </div>
    </section>
  
    <!-- Edit Current (placeholder) -->
    <section id="edit-current-season" class="card">
      <div class="card-head">Edit Current Season</div>
      <div class="card-body">
        <p class="muted">(Form/table for editing race results, driver standings, etc.)</p>
      </div>
    </section>
  
    <!-- Select Active Season -->
    <section id="select-active-season" class="card">
      <div class="card-head">Select Active Season</div>
      <div class="card-body">
        <div class="form-row">
          <label for="seasonSelectDropdown">Active Season</label>
          <select id="seasonSelectDropdown">
            <option value="">-- Loading seasons... --</option>
          </select>
        </div>
        <button class="btn btn-primary" id="setActiveBtn">Set as Active Season</button>
        <div id="activeSeasonMessage" class="status"></div>
        <div id="setActiveStatusMessage" class="status"></div>
      </div>
    </section>
  
  </div>
  
</body>
</html>
