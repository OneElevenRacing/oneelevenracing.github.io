<!DOCTYPE html>
<html lang="en-GB">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="Logos_and_icons/Icons/111_icon180.png">
    <link rel="icon" href="Logos_and_icons/Icons/111_icon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>One Eleven - Polls and Forms</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style_season.css">
    <link rel="stylesheet" href="style_motion.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="firebase-config.js"></script>
    <script src="catalogue.js"></script>
    <script src="season-ballot.js"></script>
    <script src="season-polls-core.js"></script>
    <script src="season-results.js"></script>
    <script src="season-ui.js"></script>
    <script src="season-calendar.js"></script>
    <script defer src="checkAuth.js"></script>
    <script defer src="season-polls.js"></script>
    <!-- The header shows straight away; the page content appears once sign-in is confirmed. -->
    <script>document.addEventListener('oneEleven:activeDriver', function () { document.body.classList.remove('sp-auth-pending'); });</script>
</head>
<body data-show-after-auth="true" class="sp-auth-pending">
    <header>
        <a href="main.html" class="back-button" id="backLink" aria-label="Back to home">
            <img src="Logos_and_icons/back.png" alt="">
        </a>
        <a href="settings.html" class="headerbuttonnotselected" aria-label="Settings">
            <img src="Logos_and_icons/settings.png" alt="">
        </a>
    </header>
    <main class="sp sp-driver">
        <p id="connection" class="sp-status sp-warn" role="status" hidden>You're offline. Your answers are kept on this device until you reconnect.</p>
        <div id="app">
            <div class="oe-skeleton" role="status"><span class="oe-visually-hidden">Loading…</span>
                <div class="oe-bone oe-bone-tall"></div><div class="oe-bone"></div><div class="oe-bone oe-bone-short"></div>
                <div class="oe-bone oe-bone-tall"></div><div class="oe-bone"></div><div class="oe-bone oe-bone-short"></div>
            </div>
        </div>
    </main>
</body>
</html>
