    <style>
        /* Fonts */
        @font-face {
            font-family: 'KeepCalm';

            background-color: black; /* Set the background color to black */
            width: 100%; /* Make the header span the full width of the page */

            z-index: 1000;

          border: 1px solid #000;

        text-overflow: ellipsis;

        }

        border-top: none !important;
        }

        tr.race-row td {
        border-bottom: none !important;
        }

        /* Alternating race rows in grey */
        tr.alt-row td:not([data-bonus]):not(.race-label) {
        background-color: #f5f5f5;
        }

        /* Top header row – black background, white text */
        #race-results table thead th {
            background-color: #000;
            color: white;
            font-weight: bold;
            border: 1px solid #333;
        }

        /* Keep consistent row height even when cells are empty */
        #race-results td.driver-col {

        }

        /* Make sure the blank spacer row for special events is visible */

        height: 18px;

        /* First column – race labels slightly grey*/
        td.race-label {
            background-color: #444;

            font-weight: bold;

        }

        td.race-label.special-event {
            background-color: #222;

        /* Bonus point cells */
        td[data-bonus*="PP"] { background-color: orange; }

        background-color: orange;

        /* Simple modal for the calculator */
        #calcModal {

        #calcModal .card {

        }

        #calcModal .calc-table tbody tr:nth-child(even) td {
        background-color: #f9f9f9; /* subtle zebra for readability */
        }


        /* Button style to match your UI */
        #open-calc {
        display: block;

    <script>
    // Firebase Config
    var firebaseConfig = {
        apiKey: "AIzaSyDpH1j5UfMlGXLqHaK7lqVWi0CkGbfN9SI",
        authDomain: "one-eleven-app-7f282.firebaseapp.com",
        databaseURL: "https://one-eleven-app-7f282-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "one-eleven-app-7f282",
        storageBucket: "one-eleven-app-7f282.appspot.com",
        messagingSenderId: "503866403242",
        appId: "1:503866403242:ios:782e6c3e12ec99e66aa3d3"
    };

    firebase.initializeApp(firebaseConfig);

    // Check user is authorised
    firebase.auth().onAuthStateChanged(user => {
    if (user) {
        console.log("✅ User signed in:", user.uid);

        // Check if user is a registered driver
        firebase.database().ref(`drivers/${user.uid}`).once("value")
        .then(snapshot => {
            if (snapshot.exists()) {
            console.log("✅ User is authorised as a driver:", user.uid);
            
            // ✅ You can now safely continue with Firestore stuff
            startChampionshipPage(); // 🔧 We'll define this next
            } else {

            alert("Access denied: You are not authorised.");
            window.location.href = "main.html";
            }
        })

        // Optional: Admin check
        firebase.database().ref(`drivers/${user.uid}/isAdmin`).once("value")

            document.getElementById("championship-nav").appendChild(adminBtn);

    } else {

        window.location.href = "index.html"; // adjust path if needed
    }
    });

    function startChampionshipPage() {
    // Hoist variables so both promise steps can use them
    let seasonData, races, sortedRaceKeys, eventCount, safeDropRaces, keepEvents;

    firebase.firestore().collection('championships')
        .where('isActive', '==', true)
        .limit(1)
        .get()
        .then(snapshot => {
        if (snapshot.empty) {
            document.getElementById('standings-placeholder').innerHTML = "<p>❌ No active season found.</p>";
            return null; // stop chain
        }

        const seasonDoc = snapshot.docs[0];
        seasonData = seasonDoc.data();

        // === Season parameters (single source of truth) ===
        races = seasonData.races || {};
        sortedRaceKeys = Object.keys(races).sort((a, b) => {
            return parseInt(a.replace('race', '')) - parseInt(b.replace('race', ''));
        });
        eventCount = sortedRaceKeys.length;

        const dropRaces = (typeof seasonData.dropRaces === 'number') ? seasonData.dropRaces : 0;
        safeDropRaces = Math.max(0, Math.min(dropRaces, eventCount));
        keepEvents    = eventCount - safeDropRaces;

        // Header summary
        document.getElementById('standings-placeholder').innerHTML =
            `<p style="text-align: center;font-family: 'KeepCalm', Arial, sans-serif;">
            Season: <strong>${seasonData.seasonName}</strong>
            &nbsp;|&nbsp; Car Class: <strong>${seasonData.carClass || 'Unknown'}</strong>
            &nbsp;|&nbsp; Events: <strong>${eventCount}</strong>
            &nbsp;|&nbsp; Drop Races: <strong>${safeDropRaces}</strong>
            </p>`;

        return firebase.database().ref('drivers').once('value');
        })
        .then(driverSnap => {
        if (!driverSnap) return; // bailed earlier

        // === Drivers map ===
        const driversRaw = driverSnap.val() || {};
        const driverMap = {}; // { uid: name }
        const driverUIDs = [];
        for (let uid in driversRaw) {
            if (driversRaw[uid] && driversRaw[uid].active) {
            driverMap[uid] = driversRaw[uid].name;
            driverUIDs.push(uid);
            }
        }

        window.oneElevenDrivers = {
            uids: driverUIDs,
            names: driverMap
        };

        // === Points table ===
        const positionToPoints = {
            1: 20, 2: 16, 3: 13, 4: 10, 5: 8,
            6: 6, 7: 5, 8: 3, 9: 2, 10: 1
        };

        const racePointsPerEvent   = {}; // { uid : [eventCount numbers] } one per event
        const bonusPointsPerDriver = {}; // { uid : number }

        driverUIDs.forEach(uid => {
            racePointsPerEvent[uid]   = [];
            bonusPointsPerDriver[uid] = 0;
        });

        // === Per-event points + bonuses ===
        sortedRaceKeys.forEach((raceKey, evtIndex) => {
            const race = races[raceKey] || {};
            const r1   = race.resultsRace1 || {};
            const r2   = race.resultsRace2 || {};

            // Finishing points (drop-eligible)
            driverUIDs.forEach(uid => {
            let eventPts = 0;
            const p1 = r1[uid];
            const p2 = r2[uid];

            if (race.special === true) {
                if (positionToPoints[p1]) eventPts += 2 * positionToPoints[p1]; // double R1, ignore R2
            } else {
                if (positionToPoints[p1]) eventPts += positionToPoints[p1];
                if (positionToPoints[p2]) eventPts += positionToPoints[p2];
            }

            racePointsPerEvent[uid][evtIndex] = eventPts;
            });

            // Bonuses (never dropped)
            if (race.polePositionDriver)          bonusPointsPerDriver[race.polePositionDriver]           = (bonusPointsPerDriver[race.polePositionDriver]           || 0) + 1;
            if (race.fastestLapDriverR1)          bonusPointsPerDriver[race.fastestLapDriverR1]           = (bonusPointsPerDriver[race.fastestLapDriverR1]           || 0) + 1;
            if (race.fastestLapDriverR2)          bonusPointsPerDriver[race.fastestLapDriverR2]           = (bonusPointsPerDriver[race.fastestLapDriverR2]           || 0) + 1;
            if (race.fastestLapOffPodiumDriverR1) bonusPointsPerDriver[race.fastestLapOffPodiumDriverR1]  = (bonusPointsPerDriver[race.fastestLapOffPodiumDriverR1]  || 0) + 1;
            if (race.fastestLapOffPodiumDriverR2) bonusPointsPerDriver[race.fastestLapOffPodiumDriverR2]  = (bonusPointsPerDriver[race.fastestLapOffPodiumDriverR2]  || 0) + 1;
        });

        // === Wins & Podiums ===
        const winsPerDriver    = {};
        const podiumsPerDriver = {};
        driverUIDs.forEach(uid => { winsPerDriver[uid] = 0; podiumsPerDriver[uid] = 0; });

        sortedRaceKeys.forEach((raceKey) => {
            const race = races[raceKey] || {};
            const isSpecial = race.special === true;
            const r1 = race.resultsRace1 || {};
            const r2 = race.resultsRace2 || {};

            driverUIDs.forEach(uid => {
            const pos1 = r1[uid];
            const pos2 = r2[uid];

            if (pos1 === 1) winsPerDriver[uid]++;
            if (!isSpecial && pos2 === 1) winsPerDriver[uid]++;

            if (pos1 >= 1 && pos1 <= 3) podiumsPerDriver[uid]++;
            if (!isSpecial && pos2 >= 1 && pos2 <= 3) podiumsPerDriver[uid]++;
            });
        });

        // === Poles & Fastest Laps ===
        const polePositionsPerDriver = {};
        const fastestLapsPerDriver   = {}; // { uid: { FL: n, OP: n } }
        driverUIDs.forEach(uid => {
            polePositionsPerDriver[uid] = 0;
            fastestLapsPerDriver[uid]   = { FL: 0, OP: 0 };
        });

        sortedRaceKeys.forEach((raceKey) => {
            const race = races[raceKey] || {};

            if (race.polePositionDriver) polePositionsPerDriver[race.polePositionDriver]++;

            if (race.fastestLapDriverR1)          fastestLapsPerDriver[race.fastestLapDriverR1].FL++;
            if (race.fastestLapDriverR2)          fastestLapsPerDriver[race.fastestLapDriverR2].FL++;
            if (race.fastestLapOffPodiumDriverR1) fastestLapsPerDriver[race.fastestLapOffPodiumDriverR1].OP++;
            if (race.fastestLapOffPodiumDriverR2) fastestLapsPerDriver[race.fastestLapOffPodiumDriverR2].OP++;
        });

        // === Attendance (per weekend if raced in R1 or R2) ===
        const eventsPerDriver = {};
        driverUIDs.forEach(uid => { eventsPerDriver[uid] = 0; });

        sortedRaceKeys.forEach((raceKey) => {
            const race = races[raceKey] || {};
            const r1 = race.resultsRace1 || {};
            const r2 = race.resultsRace2 || {};

            // R1
            const allR1 = Object.values(r1);
            const r1Counts = {};
            allR1.forEach(p => r1Counts[p] = (r1Counts[p] || 0) + 1);
            const realR1Cutoff = Math.max(...allR1.filter(p => r1Counts[p] === 1), 0);

            // R2
            const allR2 = Object.values(r2);
            const r2Counts = {};
            allR2.forEach(p => r2Counts[p] = (r2Counts[p] || 0) + 1);
            const realR2Cutoff = Math.max(...allR2.filter(p => r2Counts[p] === 1), 0);

            // Participation
            driverUIDs.forEach(uid => {
            const pos1 = r1[uid];
            const pos2 = r2[uid];
            const racedR1 = pos1 > 0 && pos1 <= realR1Cutoff;
            const racedR2 = pos2 > 0 && pos2 <= realR2Cutoff;
            if (racedR1 || racedR2) eventsPerDriver[uid]++;
            });
        });

        // === Drop logic (generalised) ===
        const countedRacePoints = {};
        window.oneElevenDrivers.droppedIndexes = {};
        window.oneElevenDrivers.keptIndexes    = {};

        driverUIDs.forEach(uid => {
            const ptsByEvent = (racePointsPerEvent[uid] || []).map((pts, idx) => ({ idx, pts: Number(pts) || 0 }));
            // Sort by points desc; tie-breaker: earlier event idx
            ptsByEvent.sort((a, b) => (b.pts !== a.pts) ? (b.pts - a.pts) : (a.idx - b.idx));

            const kept    = ptsByEvent.slice(0, keepEvents).map(x => x.idx);
            const dropped = ptsByEvent.slice(keepEvents).map(x => x.idx);
            const sumKept = kept.reduce((acc, idx) => acc + (Number(racePointsPerEvent[uid][idx]) || 0), 0);

            countedRacePoints[uid] = sumKept;
            window.oneElevenDrivers.droppedIndexes[uid] = dropped;
            window.oneElevenDrivers.keptIndexes[uid]    = kept;
        });

        // === Final totals ===
        const finalTotals = {};
        driverUIDs.forEach(uid => {
            finalTotals[uid] = countedRacePoints[uid] + (bonusPointsPerDriver[uid] || 0);
        });

        // === Column order by standings (leader left) with tie-breakers ===
        const uidsByStandings = [...driverUIDs].sort((a, b) => {
            const pa = finalTotals[a] || 0, pb = finalTotals[b] || 0;
            if (pb !== pa) return pb - pa;
            // tie-break: wins, then podiums
            const wa = winsPerDriver[a] || 0, wb = winsPerDriver[b] || 0;
            if (wb !== wa) return wb - wa;
            const poda = podiumsPerDriver[a] || 0, podb = podiumsPerDriver[b] || 0;
            if (podb !== poda) return podb - poda;
            // stable final fallback
            return a.localeCompare(b);
        });
        window.oneElevenDrivers.uidsByStandings = uidsByStandings;

        const sortedStandings = Object.entries(finalTotals).sort(([, a], [, b]) => b - a);

        // --- Prepare data for the calculator (min/max maths later) ---
        const eventsCompleted = sortedRaceKeys.reduce((acc, key) => {
        const race = races[key] || {};
        const r1 = race.resultsRace1 || {};
        const r2 = race.resultsRace2 || {};
        const anyR1 = Object.values(r1).some(v => typeof v === 'number');
        // for special events we ignore Race 2 points, but completion check can still be R1-only
        const anyR2 = (race.special === true) ? false : Object.values(r2).some(v => typeof v === 'number');
        return acc + ((anyR1 || anyR2) ? 1 : 0);
        }, 0);

        window.champCalcData = {
        // season meta
        seasonId: seasonData.seasonCode || '',
        seasonName: seasonData.seasonName || '',
        carClass: seasonData.carClass || '',
        eventCount,
        safeDropRaces,
        keepEvents,
        eventsCompleted,
        eventsRemaining: Math.max(0, eventCount - eventsCompleted),

        // drivers & order
        driverNames: window.oneElevenDrivers.names,
        uidsByStandings, // current column order (leader first)

        // current tallies
        finalTotals,             // counted race points + bonuses (post-drops)
        countedRacePoints,       // sum of kept event points (finishing points only)
        bonusPointsPerDriver,    // standalone bonus points
        winsPerDriver,
        podiumsPerDriver,
        polePositionsPerDriver,
        fastestLapsPerDriver,
        eventsPerDriver,

        // per-event details useful for scenario maths
        racePointsPerEvent,                    // finishing points by event index
        droppedIndexes: window.oneElevenDrivers.droppedIndexes,
        keptIndexes: window.oneElevenDrivers.keptIndexes,
        specialEventIndexes: sortedRaceKeys
            .map((key, idx) => (races[key] && races[key].special === true ? idx : -1))
            .filter(idx => idx >= 0),

        // scoring map
        positionToPoints
        };


        // === Build Race Results table ===
        const raceResultsSection = document.getElementById('race-results');

        // (Optional) clear prior table if you ever re-render:
        // const oldWrapper = raceResultsSection.querySelector('.scroll-container');
        // if (oldWrapper) oldWrapper.remove();

        const table = document.createElement('table');
        table.setAttribute('border', '1');
        table.setAttribute('cellpadding', '5');
        table.setAttribute('cellspacing', '0');
        table.style.borderCollapse = 'collapse';
        table.style.marginTop = '15px';

        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');

        const raceHeader = document.createElement('th');
        raceHeader.textContent = "Race";
        headerRow.appendChild(raceHeader);

        const colOrder = window.oneElevenDrivers.uidsByStandings || window.oneElevenDrivers.uids;
        colOrder.forEach(uid => {
            const th = document.createElement('th');
            th.textContent = window.oneElevenDrivers.names[uid];
            th.classList.add('driver-col');
            headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');

        sortedRaceKeys.forEach((raceKey, index) => {
            const race = races[raceKey] || {};
            const trackName = race.trackName || 'TBD';
            const track = (window.trackMap && window.trackMap[trackName]) || null;
            const fullLabel  = track ? track.full : trackName;

            const isSpecial = race.special === true;

            // Row 1
            const row1 = document.createElement('tr');
            row1.classList.add('race-row');
            if (isSpecial) row1.classList.add('special-event');

            const labelCell = document.createElement('td');
            labelCell.textContent = fullLabel;
            labelCell.title = isSpecial ? `${fullLabel} (Special Event – Double Points)` : fullLabel;
            labelCell.classList.add('race-label');
            if (isSpecial) labelCell.classList.add('special-event');
            labelCell.rowSpan = 2;
            labelCell.style.verticalAlign = "middle";
            row1.appendChild(labelCell);

            // cells for row1
            colOrder.forEach(uid => {
            const td = document.createElement('td');
            td.dataset.uid = uid;
            td.classList.add('driver-col');
            td.textContent = '\u00A0'; // keep visual height even when empty
            row1.appendChild(td);
            });

            // Row 2 (spacer for special)
            const row2 = document.createElement('tr');
            row2.classList.add('race-row', 'race-row-2');
            if (isSpecial) row2.classList.add('spacer-row');

            colOrder.forEach(uid => {
            const td = document.createElement('td');
            td.dataset.uid = uid;
            td.classList.add('driver-col');
            td.textContent = '\u00A0'; // keep visible spacer
            row2.appendChild(td);
            });

            tbody.appendChild(row1);
            tbody.appendChild(row2);

            if (index % 2 === 1) {
            row1.classList.add('alt-row');
            row2.classList.add('alt-row');
            }
        });

        table.appendChild(tbody);

        const scrollWrapper = document.createElement('div');
        scrollWrapper.className = 'scroll-container';
        scrollWrapper.appendChild(table);
        raceResultsSection.appendChild(scrollWrapper);

        // === Populate results (with data-bonus for colours) ===
        let rowPointer = 0;
        sortedRaceKeys.forEach((raceKey, raceIndex) => {
            const race = races[raceKey] || {};
            const isSpecial = race.special === true;

            const row1 = tbody.children[rowPointer];
            const row2 = tbody.children[rowPointer + 1];

            const r1 = race.resultsRace1 || {};
            const r2 = race.resultsRace2 || {};

            const colOrder = window.oneElevenDrivers.uidsByStandings || window.oneElevenDrivers.uids;

            colOrder.forEach((uid, driverIndex) => {
            const pos1 = r1[uid];
            const pos2 = r2[uid];

            let points1 = positionToPoints[pos1] || '';
            let points2 = positionToPoints[pos2] || '';
            if (isSpecial && points1) points1 *= 2;

            const bonuses1 = [];
            const bonuses2 = [];

            if (race.polePositionDriver === uid)          bonuses1.push("PP");
            if (race.fastestLapDriverR1 === uid)          bonuses1.push("FL");
            if (race.fastestLapOffPodiumDriverR1 === uid) bonuses1.push("OP");

            if (!isSpecial) {
                if (race.fastestLapDriverR2 === uid)          bonuses2.push("FL");
                if (race.fastestLapOffPodiumDriverR2 === uid) bonuses2.push("OP");
            }

            const dropped = window.oneElevenDrivers.droppedIndexes[uid] || [];

            // Row 1
            const cell1 = row1.children[driverIndex + 1];
            if (cell1) {
                if (dropped.includes(raceIndex)) cell1.dataset.dropped = "true";
                const text1 = (points1 ? String(points1) : '') +
                            (bonuses1.length ? ` (${bonuses1.join('+')})` : '');
                cell1.textContent = text1 || '\u00A0';
                // Bonus colour tags
                if (bonuses1.length) cell1.dataset.bonus = bonuses1.join('+'); // <-- PP/FL/OP selectors match
                if (bonuses1.includes("PP") && bonuses1.includes("FL")) cell1.dataset.combo = "pole-fl";
                if (bonuses1.includes("PP") && bonuses1.includes("OP")) cell1.dataset.combo = "pole-op";
            }

            // Row 2 (blank for special)
            const cell2 = row2.children[driverIndex];
            if (!isSpecial && cell2) {
                if (dropped.includes(raceIndex)) cell2.dataset.dropped = "true";
                const text2 = (points2 ? String(points2) : '') +
                            (bonuses2.length ? ` (${bonuses2.join('+')})` : '');
                cell2.textContent = text2 || '\u00A0';
                if (bonuses2.length) cell2.dataset.bonus = bonuses2.join('+'); // <-- PP/FL/OP selectors match
                if (bonuses2.includes("PP") && bonuses2.includes("FL")) cell2.dataset.combo = "pole-fl";
                if (bonuses2.includes("PP") && bonuses2.includes("OP")) cell2.dataset.combo = "pole-op";
            }
            });

            rowPointer += 2;
        });

        // === Standings table ===
        const standingsSection = document.getElementById('current-standings');
        const standingsTable = document.createElement('table');
        standingsTable.style.borderCollapse = 'collapse';
        standingsTable.style.marginTop = '10px';
        standingsTable.style.marginLeft = 'auto';
        standingsTable.style.marginRight = 'auto';

        const standingsThead = document.createElement('thead');
        const headRow = document.createElement('tr');

        ['Position', 'Driver', 'Points', 'Diff', 'Wins', 'Pole Positions', 'Fastest Laps', 'Podiums', 'Events'].forEach(label => {
            const th = document.createElement('th');
            th.textContent = label;
            headRow.appendChild(th);
        });

        standingsThead.appendChild(headRow);
        standingsTable.appendChild(standingsThead);

        sortedStandings.forEach(([uid, total], index) => {
            const row = document.createElement('tr');
            if (index === 0) row.classList.add('podium-1');
            if (index === 1) row.classList.add('podium-2');
            if (index === 2) row.classList.add('podium-3');

            const pos  = document.createElement('td'); pos.textContent = index + 1;
            const name = document.createElement('td'); name.textContent = window.oneElevenDrivers.names[uid] || '(Unknown)';
            const pts  = document.createElement('td'); pts.textContent  = total;

            const diff = document.createElement('td');
            if (index === 0) {
            diff.textContent = "n/a";
            } else {
            const pointsAhead = sortedStandings[index - 1][1];
            const diffValue = total - pointsAhead;
            diff.textContent = (diffValue > 0 ? "+" : "") + diffValue;
            }

            [pos, name, pts, diff].forEach(td => {
            td.style.border = '1px solid #ccc';
            td.style.padding = '6px';
            });

            row.appendChild(pos);
            row.appendChild(name);
            row.appendChild(pts);
            row.appendChild(diff);

            const wins    = document.createElement('td'); wins.textContent    = winsPerDriver[uid] || 0;
            const poles   = document.createElement('td'); poles.textContent   = polePositionsPerDriver[uid] || 0;

            const flObj   = fastestLapsPerDriver[uid] || { FL: 0, OP: 0 };
            const flText  = flObj.FL && flObj.OP ? `${flObj.FL} FL + ${flObj.OP} OP`
                        : flObj.FL            ? `${flObj.FL} FL`
                        : flObj.OP            ? `${flObj.OP} OP`
                                                : "0";
            const fl      = document.createElement('td'); fl.textContent      = flText;

            const podiums = document.createElement('td'); podiums.textContent = podiumsPerDriver[uid] || 0;
            const events  = document.createElement('td'); events.textContent  = eventsPerDriver[uid] || 0;

            [wins, poles, fl, podiums, events].forEach(td => {
            td.style.border = '1px solid #ccc';
            td.style.padding = '6px';
            });

            row.appendChild(wins);
            row.appendChild(poles);
            row.appendChild(fl);
            row.appendChild(podiums);
            row.appendChild(events);

            standingsTable.appendChild(row);
        });

        standingsSection.appendChild(standingsTable);

        // === Calculator Button (opens modal, uses the data package above) ===
        let tools = document.getElementById('standings-tools');
            if (!tools) {
            tools = document.createElement('div');
            tools.id = 'standings-tools';
            tools.style.textAlign = 'center';
            standingsSection.appendChild(tools);
        }

        const calcBtn = document.createElement('button');
        calcBtn.id = 'open-calc';
        calcBtn.textContent = 'Calculate Title Scenarios';
        calcBtn.onclick = () => openPointsCalculator(window.champCalcData);

        tools.appendChild(calcBtn);

        })
        .catch(error => {
        console.error("Error loading season:", error);
        document.getElementById('standings-placeholder').innerHTML = "<p>❌ Failed to load active season.</p>";
        });
    }


    function openLink(url) {
        window.open(url, '_blank');
    }
    </script>
