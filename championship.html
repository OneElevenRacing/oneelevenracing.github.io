    <style>
        /* Fonts */
        @font-face {
            font-family: 'KeepCalm';
            src: url('KeepCalm-Medium.ttf') format('truetype'), /* Specify the path to your font files */
        }

        body {
            font-family: 'KeepCalm', Arial, sans-serif; /* Use your custom font as the primary font family, fallback to Arial if it's not available */
            margin: 0;
            padding-top: 60px;
            padding-bottom: 125px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            background-color: black; /* Set the background color to black */
            width: 100%; /* Make the header span the full width of the page */
            height: 60px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Add a drop shadow */
        }


        /* Styling the rows in the race results table*/
        table th, table td {
          padding: 3px 4px;
          border: 1px solid #000;
          text-align: center;
        }
      
        table th {
          background-color: #f0f0f0;
        }

        /* Sticky left column */
        th:first-child,
        td.race-label {
        position: sticky;
        left: 0;
        background-color: #f8f8f8;
        z-index: 2;
        font-weight: bold;
        text-align: left;
        white-space: nowrap;
        }

        /* Make all driver columns equal width */
        th.driver-col,
        td.driver-col {
        width: 75px; /* adjust as needed */
        max-width: 75px;
        min-width: 75px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        }

        /* Remove border between Race 1 and Race 2 rows */
        tr.race-row-2 td {
        border-top: none !important;
        }

        tr.race-row td {
        border-bottom: none !important;
        }

        /* Alternating race rows in grey */
        tr.alt-row td:not([data-bonus]):not(.race-label) {
        background-color: #f5f5f5;
        }

        /* Top header row – black background, white text */
        #race-results table thead th {
            background-color: #000;
            color: white;
            font-weight: bold;
            border: 1px solid #333;
        }

        /* Keep consistent row height even when cells are empty */
        #race-results td.driver-col {
        height: 18px;
        line-height: 18px;
        }

        /* Make sure the blank spacer row for special events is visible */
        #race-results tr.spacer-row td {
        height: 18px;
        line-height: 18px;
        }
      
        /* First column – race labels slightly grey*/
        td.race-label {
            background-color: #444;
            color: white;
            font-weight: bold;
            border: 1px solid #333;
        }

        td.race-label.special-event {
            background-color: #222;
            color: #ffcc00; /* gold-like for emphasis */
            border: 1px solid #666;
            font-weight: bold;
        }

        /* Bonus point cells */
        td[data-bonus*="PP"] { background-color: orange; }
        td[data-bonus*="FL"] { background-color: yellow; }
        td[data-bonus*="OP"] { background-color: cyan; }

        /* Combo cells: Pole + Fastest Lap */
        td[data-combo="pole-fl"] {
        background-color: orange;
        color: yellow; /* or yellow; choose what’s most visible */
        font-weight: bold;
        }

        /* Combo cells: Pole + Off-Podium Fastest Lap */
        td[data-combo="pole-op"] {
        background-color: orange;
        color: blue;
        font-weight: bold;
        }

        td[data-dropped="true"] .dropped-race-points {
        text-decoration: line-through;
        color: #999;
        opacity: 0.6;
        }

        .scroll-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        width: 100%;
        margin: 0 auto;
        box-sizing: border-box; /* Ensures padding doesn’t exceed 100% width */
        }

        .scroll-container table {
        min-width: 600px; /* Adjust depending on your table's natural width */
        margin-left: auto;
        margin-right: auto;
        }

        /* Compact font and spacing for race results only */
        #race-results table,
        #current-standings table {
        font-family: 'KeepCalm', Arial, sans-serif;
        font-size: 10px;         /* ⬅️ Smaller font */
        line-height: 1.2;        /* ⬅️ Reduces row height */
        table-layout: fixed;     /* ⬅️ More consistent column sizing */
        }

        /* Standings table header – black background, white text */
        #current-standings table thead th {
        background-color: #000;
        color: white;
        font-weight: bold;
        border: 1px solid #333;
        }

        .standings-header-mobile {
        display: none;
        }

        }

        #current-standings table tr.podium-2 td {
        background-color: silver;
        font-weight: bold;
        }

        #current-standings table tr.podium-3 td {

            height: 100%;
            background-color: #ffffff; /* Set background color */

            text-decoration: none; /* Remove default text decoration */

            color: #000000; /* Change text color on hover */

        .footerbuttonnotselected img {

        }

        .footerbuttonselected {
            display: flex; /* Use flexbox to center content */

            justify-content: center; /* Align items horizontally */
            width: 33.3%;
            height: 100%;
            background-color: #ffffff; /* Set background color */
            color: #000000; /* Set text color */
            border: none; /* Remove border */
            text-decoration: none; /* Remove default text decoration */
            flex-direction: column; /* Stack items vertically */
            float: left;
            font-size: 0.9em;

        .then(snapshot => {

            console.log("✅ User is authorised as a driver:", user.uid);
            
            // ✅ You can now safely continue with Firestore stuff

            const resultsBtn = document.getElementById("enterResultsButton");
            if (resultsBtn) resultsBtn.style.display = "";

            } else {

        .catch(error => {

    } else {

        alert("Please sign in first.");
        window.location.href = "index.html"; // adjust path if needed
    }
    });

    function startChampionshipPage() {
    // Hoist variables so both promise steps can use them
    let seasonData, races, sortedRaceKeys, eventCount, safeDropRaces, keepEvents;

    firebase.firestore().collection('championships')
        .where('isActive', '==', true)
        .limit(1)
        .get()
        .then(snapshot => {
        if (snapshot.empty) {
            document.getElementById('standings-placeholder').innerHTML = "<p>❌ No active season found.</p>";
            return null; // stop chain
        }

        const seasonDoc = snapshot.docs[0];
        seasonData = seasonDoc.data();

        // === Season parameters (single source of truth) ===
        races = seasonData.races || {};
        sortedRaceKeys = Object.keys(races).sort((a, b) => {
            return parseInt(a.replace('race', '')) - parseInt(b.replace('race', ''));
        });
        eventCount = sortedRaceKeys.length;

        const dropRaces = (typeof seasonData.dropRaces === 'number') ? seasonData.dropRaces : 0;
        safeDropRaces = Math.max(0, Math.min(dropRaces, eventCount));
        keepEvents    = eventCount - safeDropRaces;

        // Header summary
        document.getElementById('standings-placeholder').innerHTML =
            `<p style="text-align: center;font-family: 'KeepCalm', Arial, sans-serif;">
            Season: <strong>${seasonData.seasonName}</strong>
            &nbsp;|&nbsp; Car Class: <strong>${seasonData.carClass || 'Unknown'}</strong>
            &nbsp;|&nbsp; Events: <strong>${eventCount}</strong>
            &nbsp;|&nbsp; Drop Races: <strong>${safeDropRaces}</strong>
            </p>`;

        return firebase.database().ref('drivers').once('value');
        })
        .then(driverSnap => {
        if (!driverSnap) return; // bailed earlier

        // === Drivers map ===
        const driversRaw = driverSnap.val() || {};
        const driverMap = {}; // { uid: name }
        const driverUIDs = [];
        for (let uid in driversRaw) {
            if (driversRaw[uid] && driversRaw[uid].active) {
            driverMap[uid] = driversRaw[uid].name;
            driverUIDs.push(uid);
            }
        }

        window.oneElevenDrivers = {
            uids: driverUIDs,
            names: driverMap
        };

        // === Points table ===
        const positionToPoints = {
            1: 20, 2: 16, 3: 13, 4: 10, 5: 8,
            6: 6, 7: 5, 8: 3, 9: 2, 10: 1
        };

        const racePointsPerEvent   = {}; // { uid : [eventCount numbers] } one per event
        const bonusPointsPerDriver = {}; // { uid : number }

        driverUIDs.forEach(uid => {
            racePointsPerEvent[uid]   = [];
            bonusPointsPerDriver[uid] = 0;
        });

        // === Per-event points + bonuses ===
        sortedRaceKeys.forEach((raceKey, evtIndex) => {
            const race = races[raceKey] || {};
            const r1   = race.resultsRace1 || {};
            const r2   = race.resultsRace2 || {};

            // Finishing points (drop-eligible)
            driverUIDs.forEach(uid => {
            let eventPts = 0;
            const p1 = r1[uid];
            const p2 = r2[uid];

            if (race.special === true) {
                if (positionToPoints[p1]) eventPts += 2 * positionToPoints[p1]; // double R1, ignore R2
            } else {
                if (positionToPoints[p1]) eventPts += positionToPoints[p1];
                if (positionToPoints[p2]) eventPts += positionToPoints[p2];
            }

            racePointsPerEvent[uid][evtIndex] = eventPts;
            });

            // Bonuses (never dropped)
            if (race.polePositionDriver)          bonusPointsPerDriver[race.polePositionDriver]           = (bonusPointsPerDriver[race.polePositionDriver]           || 0) + 1;
            if (race.fastestLapDriverR1)          bonusPointsPerDriver[race.fastestLapDriverR1]           = (bonusPointsPerDriver[race.fastestLapDriverR1]           || 0) + 1;
            if (race.fastestLapDriverR2)          bonusPointsPerDriver[race.fastestLapDriverR2]           = (bonusPointsPerDriver[race.fastestLapDriverR2]           || 0) + 1;
            if (race.fastestLapOffPodiumDriverR1) bonusPointsPerDriver[race.fastestLapOffPodiumDriverR1]  = (bonusPointsPerDriver[race.fastestLapOffPodiumDriverR1]  || 0) + 1;
            if (race.fastestLapOffPodiumDriverR2) bonusPointsPerDriver[race.fastestLapOffPodiumDriverR2]  = (bonusPointsPerDriver[race.fastestLapOffPodiumDriverR2]  || 0) + 1;
        });

        // === Wins & Podiums ===
        const winsPerDriver    = {};
        const podiumsPerDriver = {};
        driverUIDs.forEach(uid => { winsPerDriver[uid] = 0; podiumsPerDriver[uid] = 0; });

        sortedRaceKeys.forEach((raceKey) => {
            const race = races[raceKey] || {};
            const isSpecial = race.special === true;
            const r1 = race.resultsRace1 || {};
            const r2 = race.resultsRace2 || {};

            driverUIDs.forEach(uid => {
            const pos1 = r1[uid];
            const pos2 = r2[uid];

            if (pos1 === 1) winsPerDriver[uid]++;
            if (!isSpecial && pos2 === 1) winsPerDriver[uid]++;

            if (pos1 >= 1 && pos1 <= 3) podiumsPerDriver[uid]++;
            if (!isSpecial && pos2 >= 1 && pos2 <= 3) podiumsPerDriver[uid]++;
            });
        });

        // === Poles & Fastest Laps ===
        const polePositionsPerDriver = {};
        const fastestLapsPerDriver   = {}; // { uid: { FL: n, OP: n } }
        driverUIDs.forEach(uid => {
            polePositionsPerDriver[uid] = 0;
            fastestLapsPerDriver[uid]   = { FL: 0, OP: 0 };
        });

        sortedRaceKeys.forEach((raceKey) => {
            const race = races[raceKey] || {};

            if (race.polePositionDriver) polePositionsPerDriver[race.polePositionDriver]++;

            if (race.fastestLapDriverR1)          fastestLapsPerDriver[race.fastestLapDriverR1].FL++;
            if (race.fastestLapDriverR2)          fastestLapsPerDriver[race.fastestLapDriverR2].FL++;
            if (race.fastestLapOffPodiumDriverR1) fastestLapsPerDriver[race.fastestLapOffPodiumDriverR1].OP++;
            if (race.fastestLapOffPodiumDriverR2) fastestLapsPerDriver[race.fastestLapOffPodiumDriverR2].OP++;
        });

        // === Attendance (per weekend if raced in R1 or R2) ===
        const eventsPerDriver = {};
        driverUIDs.forEach(uid => { eventsPerDriver[uid] = 0; });

        sortedRaceKeys.forEach((raceKey) => {
            const race = races[raceKey] || {};
            const r1 = race.resultsRace1 || {};
            const r2 = race.resultsRace2 || {};
            const participantsR1 = Array.isArray(race.participantsRace1)
                ? new Set(race.participantsRace1)
                : null;
            const participantsR2 = Array.isArray(race.participantsRace2)
                ? new Set(race.participantsRace2)
                : null;

            // R1
            const allR1 = Object.values(r1);
            const r1Counts = {};
            allR1.forEach(p => r1Counts[p] = (r1Counts[p] || 0) + 1);
            const realR1Cutoff = Math.max(...allR1.filter(p => r1Counts[p] === 1), 0);

            // R2
            const allR2 = Object.values(r2);
            const r2Counts = {};
            allR2.forEach(p => r2Counts[p] = (r2Counts[p] || 0) + 1);
            const realR2Cutoff = Math.max(...allR2.filter(p => r2Counts[p] === 1), 0);

            // Participation
            driverUIDs.forEach(uid => {
            const pos1 = r1[uid];
            const pos2 = r2[uid];
            const racedR1 = participantsR1
                ? participantsR1.has(uid)
                : pos1 > 0 && pos1 <= realR1Cutoff;
            const racedR2 = participantsR2
                ? participantsR2.has(uid)
                : pos2 > 0 && pos2 <= realR2Cutoff;
            if (racedR1 || racedR2) eventsPerDriver[uid]++;
            });
        });

        // === Drop logic (generalised) ===
        const countedRacePoints = {};
        window.oneElevenDrivers.droppedIndexes = {};
        window.oneElevenDrivers.keptIndexes    = {};

        driverUIDs.forEach(uid => {
            const ptsByEvent = (racePointsPerEvent[uid] || []).map((pts, idx) => ({ idx, pts: Number(pts) || 0 }));
            // Sort by points desc; tie-breaker: earlier event idx
            ptsByEvent.sort((a, b) => (b.pts !== a.pts) ? (b.pts - a.pts) : (a.idx - b.idx));

            const kept    = ptsByEvent.slice(0, keepEvents).map(x => x.idx);
            const dropped = ptsByEvent.slice(keepEvents).map(x => x.idx);
            const sumKept = kept.reduce((acc, idx) => acc + (Number(racePointsPerEvent[uid][idx]) || 0), 0);

            countedRacePoints[uid] = sumKept;
            window.oneElevenDrivers.droppedIndexes[uid] = dropped;
            window.oneElevenDrivers.keptIndexes[uid]    = kept;
        });

        // === Final totals ===
        const finalTotals = {};
        driverUIDs.forEach(uid => {
            finalTotals[uid] = countedRacePoints[uid] + (bonusPointsPerDriver[uid] || 0);
        });

        // === Column order by standings (leader left) with tie-breakers ===
        const uidsByStandings = [...driverUIDs].sort((a, b) => {
            const pa = finalTotals[a] || 0, pb = finalTotals[b] || 0;
            if (pb !== pa) return pb - pa;
            // tie-break: wins, then podiums
            const wa = winsPerDriver[a] || 0, wb = winsPerDriver[b] || 0;
            if (wb !== wa) return wb - wa;
            const poda = podiumsPerDriver[a] || 0, podb = podiumsPerDriver[b] || 0;
            if (podb !== poda) return podb - poda;
            // stable final fallback
            return a.localeCompare(b);
        });
        window.oneElevenDrivers.uidsByStandings = uidsByStandings;

        const sortedStandings = Object.entries(finalTotals).sort(([, a], [, b]) => b - a);

        // --- Prepare data for the calculator (min/max maths later) ---
        const eventsCompleted = sortedRaceKeys.reduce((acc, key) => {
        const race = races[key] || {};
        const r1 = race.resultsRace1 || {};
        const r2 = race.resultsRace2 || {};
        const anyR1 = Object.values(r1).some(v => typeof v === 'number');
        // for special events we ignore Race 2 points, but completion check can still be R1-only
        const anyR2 = (race.special === true) ? false : Object.values(r2).some(v => typeof v === 'number');
        return acc + ((anyR1 || anyR2) ? 1 : 0);
        }, 0);

        window.champCalcData = {
        // season meta
        seasonId: seasonData.seasonCode || '',
        seasonName: seasonData.seasonName || '',
        carClass: seasonData.carClass || '',
        eventCount,

        eventsRemaining: Math.max(0, eventCount - eventsCompleted),

        // drivers & order
        driverNames: window.oneElevenDrivers.names,
        uidsByStandings, // current column order (leader first)

        // current tallies
        finalTotals,             // counted race points + bonuses (post-drops)
        countedRacePoints,       // sum of kept event points (finishing points only)
        bonusPointsPerDriver,    // standalone bonus points
        winsPerDriver,

        polePositionsPerDriver,
        fastestLapsPerDriver,
        eventsPerDriver,

        // per-event details useful for scenario maths
        racePointsPerEvent,                    // finishing points by event index
        droppedIndexes: window.oneElevenDrivers.droppedIndexes,

        eventDetails: sortedRaceKeys.map((key, idx) => {

            hasPoleResult: Boolean(race.polePositionDriver),
            hasFastestLapR1Result: Boolean(
                race.fastestLapDriverR1 || race.fastestLapOffPodiumDriverR1
            ),
            hasFastestLapR2Result: Boolean(
                race.fastestLapDriverR2 || race.fastestLapOffPodiumDriverR2
            )
            };
        }),

        // scoring map
        positionToPoints
        };


        // === Build Race Results table ===
        const raceResultsSection = document.getElementById('race-results');

        // (Optional) clear prior table if you ever re-render:
        // const oldWrapper = raceResultsSection.querySelector('.scroll-container');
